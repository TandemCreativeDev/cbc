[build]
  command = "if [ -n \"$DATABASE_URL\" ]; then pnpm exec payload migrate; fi && pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Media in public/ keeps its filename, so cache for 30 days rather than a year.
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/hologram/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/svg/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
